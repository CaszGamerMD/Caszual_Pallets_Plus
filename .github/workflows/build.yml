name: Build and integration smoke
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build and unit tests
        run: gradle build --stacktrace
      - name: Validate generated assets and addon boundary
        run: |
          python3 scripts/transport_assets_smoke.py
          python3 scripts/addon_boundary_smoke.py
      - name: Dedicated server startup with Caszual Additions
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 150s gradle runServer --args='nogui' > server-smoke.log 2>&1
          status=$?
          set -e
          cat server-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'Done (' server-smoke.log
          if grep -E 'Mixin apply failed|InvalidMixinException|NoClassDefFoundError' server-smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: |
            server-smoke.log
            build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: Caszual-Pallets-Plus
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
